name: Deploy static demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci --no-audit --no-fund

      - name: Install pinned lint tooling
        working-directory: client
        run: npm install --no-save --package-lock=false --no-audit --no-fund eslint@8.57.0 eslint-config-expo@8.0.1

      - name: Check client
        working-directory: client
        run: |
          npm run typecheck
          npm run lint

      - name: Export static local-first demo
        working-directory: client
        env:
          CI: "true"
          EXPO_NO_TELEMETRY: "1"
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_BASE_URL: "/${{ github.event.repository.name }}"
          EXPO_PUBLIC_STATIC_DEMO: ${{ vars.EXPO_PUBLIC_API_URL == '' && 'true' || 'false' }}
        run: npx expo export --platform web --output-dir dist

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
