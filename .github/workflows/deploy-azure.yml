name: Deploy API to Azure

on:
  workflow_dispatch:

env:
  AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_PRINCIPAL_ID: ${{ secrets.AZURE_PRINCIPAL_ID }}
  AZURE_PRINCIPAL_TYPE: ServicePrincipal
  FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
  FRONTEND_BASE_URL: ${{ vars.FRONTEND_BASE_URL }}
  DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
  JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  VERIFIED_SENDER_EMAIL: ${{ vars.VERIFIED_SENDER_EMAIL }}

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Provision and deploy API
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Authenticate with workload identity
        run: >-
          azd auth login
          --client-id "${{ secrets.AZURE_CLIENT_ID }}"
          --tenant-id "${{ secrets.AZURE_TENANT_ID }}"
          --federated-credential-provider github

      - name: Provision and deploy
        run: azd up --no-prompt

      - name: Show deployment outputs
        run: azd env get-values
